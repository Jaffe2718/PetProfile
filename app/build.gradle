plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jaffe2718.petprofile'
    compileSdk 37
    compileSdkMinor 0

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('local.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(keystorePropertiesFile.newInputStream())
            }
            storeFile rootProject.file('PetProfile.jaffe2718.jks')
            storePassword keystoreProperties.getProperty('RELEASE_STORE_PASSWORD')
            keyAlias keystoreProperties.getProperty('RELEASE_KEY_ALIAS')
            keyPassword keystoreProperties.getProperty('RELEASE_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId "io.github.jaffe2718.petprofile"
        minSdk 26
        targetSdk 37
        versionCode 11
        versionName "0.3.3"
        def msalClientId = "89b7a0bb-d68f-408b-a0ec-3064170dbd33"
        buildConfigField "String", "MSAL_CLIENT_ID", "\"${msalClientId}\""
        manifestPlaceholders = [msalScheme: "msal${msalClientId}"]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.zxing:core:3.5.4'

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'
}

// Ship the release build as petprofile.apk, the name the in-app update check downloads.
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("petprofile.apk")
        }
    }
}
